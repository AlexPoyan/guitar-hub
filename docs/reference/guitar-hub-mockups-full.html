<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guitar Hub: повний набір макетів</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&amp;family=Onest:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#F2F6F4;--surface:#FFFFFF;--soft:#E9F0ED;--ink:#14211D;--muted:#566860;--line:#D3DDD8;--accent:#1B7A6B;--accent-ink:#0B4B41;--tint:#D9EEE8;--root:#D9442A;--ok:#1E8A55;--warn:#B45F06;--warn-bg:#FBEBD3;--ok-bg:#DDF1E5;--ok-ink:#14583A;--warn-ink:#7A3F04;--side:#E4ECE9;--tb1:#EEF3F1;--tb2:#E4EBE8;--bar-a:#CFE8E1;--bar-at:#17403A;--bar-b:#EADFB9;--bar-bt:#4A3E14;--off:#C5D0CC;--cb:#8CA19A}
.dark{--bg:#0F1514;--surface:#172120;--soft:#1E2B29;--ink:#E5EEEB;--muted:#93A8A1;--line:#2B3C39;--accent:#52C7B2;--accent-ink:#C3F0E6;--tint:#1B3B36;--root:#F0634A;--ok:#58D18F;--warn:#E8A04A;--warn-bg:#4A3418;--ok-bg:#1B4030;--ok-ink:#BDEFD3;--warn-ink:#F8DDB4;--side:#131B1A;--tb1:#1C2726;--tb2:#162120;--bar-a:#1F4540;--bar-at:#CDEFE7;--bar-b:#4A4224;--bar-bt:#F0E3B5;--off:#3A4C48;--cb:#6A8179}
*{box-sizing:border-box}
body{margin:0;background:#C9D3CF;color:#14211D;font:15px/1.5 "Onest",-apple-system,"SF Pro Text",system-ui,sans-serif}
.page{padding:28px 24px 80px;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:34px}
.intro{align-self:stretch}
.intro h1{font:700 34px "Literata",Georgia,serif;margin:0 0 6px}
.intro p{margin:0 0 14px;max-width:80ch}
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 24px;background:#fff;border:1px solid #D3DDD8;border-radius:12px;padding:18px 22px}
.idx h4{margin:0 0 6px;font:700 15px "Literata",Georgia,serif}
.idx a{display:block;font-size:14px;color:#0B4B41;text-decoration:none;padding:1px 0}
.idx a:hover{text-decoration:underline}
.grp{align-self:flex-start;font:700 28px "Literata",Georgia,serif;margin:18px 0 -14px}
.label{align-self:flex-start;font:600 16px "Onest",sans-serif;margin:0 0 -20px;color:#14211D}
.holder{position:relative}
.stage{width:1280px;height:800px;transform-origin:top left}
.win{width:1280px;height:800px;background:var(--bg);color:var(--ink);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(0,0,0,.18),0 24px 60px rgba(20,33,29,.28)}
.tb{height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 18px;background:linear-gradient(var(--tb1),var(--tb2));border-bottom:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:6px}
.tb .t{flex:1;text-align:center;font-size:13px;font-weight:600;margin-right:52px}
.body{flex:1;display:flex;min-height:0}
nav{width:208px;flex-shrink:0;padding:14px 12px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
nav small{font-size:12px;color:var(--muted);padding:4px 10px 6px}
nav small.g2{padding-top:16px}
nav a{display:flex;align-items:center;height:32px;padding:0 10px;border-radius:6px;font-size:14px;color:var(--ink)}
nav a.on{background:var(--tint);color:var(--accent-ink);font-weight:600}
.brand{display:flex;align-items:center;gap:9px;padding:0 10px 14px;font:700 18px "Literata",Georgia,serif;letter-spacing:-0.3px;white-space:nowrap}
.brand i{font-style:normal;color:var(--accent)}
main{flex:1;min-width:0;padding:18px 28px;display:flex;flex-direction:column;gap:14px}
main.tight{gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--muted);font-size:13px}
.pill{height:34px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--surface);display:inline-flex;align-items:center;font-size:14px;white-space:nowrap}
.pill.on{background:var(--tint);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn{font:inherit;font-size:14px;height:32px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.dark .btn.pri{color:#0A1F1B}
.btn.lg{height:44px;padding:0 28px;font-size:16px}
.btn.sec{background:var(--soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-ink)}
.sel{height:32px;padding:0 10px 0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:inline-flex;align-items:center;gap:22px;font-size:14px;white-space:nowrap}
.sel::after{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-2px)}
.inp{height:32px;min-width:64px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:inline-flex;align-items:center;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg span{height:30px;padding:0 15px;display:inline-flex;align-items:center;font-size:14px;white-space:nowrap}
.seg span+span{border-left:1px solid var(--line)}
.seg span.on{background:var(--tint);color:var(--accent-ink);font-weight:500}
.chip{height:32px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:inline-flex;align-items:center;font-size:14px;white-space:nowrap}
.chip.on{background:var(--tint);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.card h3{margin:0 0 8px;font:700 17px "Literata",Georgia,serif}
.card p{margin:0 0 8px;font-size:14px;max-width:80ch}
.legend{display:flex;gap:20px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:7px;vertical-align:-2px;margin-right:8px;border:1px solid rgba(0,0,0,.2)}
.big{font:700 60px/64px "Literata",Georgia,serif;font-variant-numeric:tabular-nums}
.slider{position:relative;height:20px;display:inline-block}
.slider b{position:absolute;left:0;right:0;top:8px;height:4px;border-radius:2px;background:var(--soft)}
.slider b i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent)}
.slider u{position:absolute;top:2px;width:16px;height:16px;border-radius:8px;background:#fff;border:2px solid var(--accent);margin-left:-8px}
.sw{width:34px;height:20px;border-radius:10px;background:var(--off);position:relative;display:inline-block;flex-shrink:0}
.sw.on{background:var(--accent)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:#fff}
.sw.on::after{left:16px}
.lbl{width:92px;font-size:13px;color:var(--muted)}
.beats{display:flex;align-items:flex-end;gap:8px}
.beats div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.beats div.gs{margin-left:10px}
.beats i{display:block;width:30px;border-radius:6px;background:var(--accent)}
.beats div:first-child i{outline:2px solid var(--ink);outline-offset:2px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:500}
.badge.ok{background:var(--ok-bg);color:var(--ok-ink)}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}
.sd{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--muted)}
.sd.ok{background:var(--ok)}.sd.w{background:var(--warn)}
.strip{position:relative;height:92px}
.strip .zone{position:absolute;top:6px;height:56px;border-radius:6px;background:var(--ok-bg)}
.strip .tk{position:absolute;width:2px;background:var(--muted)}
.strip .tl{position:absolute;top:68px;width:48px;text-align:center;font-size:12px;color:var(--muted)}
.strip .nd{position:absolute;width:4px;height:62px;top:2px;border-radius:2px;background:var(--ink)}
.cells{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.cell{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);font-size:13px}
.cell.cur{border:2px solid var(--accent);padding:9px 11px}
.cell div{display:flex;align-items:center;gap:6px;margin-top:2px;color:var(--ink)}
.cell span{color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:500;color:var(--muted);font-size:12px}
.tbl tr:last-child td{border-bottom:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tips{margin:0;padding:0;list-style:none;font-size:14px}
.tips li{padding:7px 0;border-bottom:1px solid var(--line)}
.tips li:last-child{border-bottom:0}
.steps{margin:0;padding-left:20px;font-size:14px}
.steps li{padding:5px 0}
.tone{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid rgba(0,0,0,.15);color:#22170F}
.pc{display:inline-flex;flex-direction:column;align-items:center;padding:4px 12px;border:1px solid var(--line);border-radius:8px;min-width:58px;background:var(--surface);font-weight:600}
.pc small{font-weight:400;font-size:11px;color:var(--muted)}
.prog{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.prog .nm{width:200px;font-size:13px;color:var(--muted)}
.pbar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 28px}
.cols3 h4{margin:0 0 8px;font:700 16px "Literata",Georgia,serif}
.ck{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px}
.cb{width:16px;height:16px;margin-top:3px;border:1.5px solid var(--cb);border-radius:4px;flex-shrink:0;background:var(--surface);position:relative}
.cb.on{background:var(--accent);border-color:var(--accent)}
.cb.on::after{content:"";position:absolute;left:4px;top:0;width:4px;height:9px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg)}
.fb{font-size:14px}
.gal{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600}
.cd svg{width:120px;height:auto}
.err{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:10px;background:var(--warn-bg);color:var(--warn-ink);font-size:14px;max-width:640px}
.phones{display:flex;gap:34px;flex-wrap:wrap;justify-content:center}
.ph{width:410px;height:864px;border-radius:56px;background:#101313;padding:10px;box-shadow:0 24px 60px rgba(20,33,29,.35)}
.scr{width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.ptop{height:64px;flex-shrink:0;display:flex;align-items:flex-end;padding:0 20px 8px;font:700 22px "Literata",Georgia,serif}
.pbody{flex:1;min-height:0;padding:6px 16px 10px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.tabbar{height:78px;flex-shrink:0;border-top:1px solid var(--line);background:var(--surface);display:flex;padding:8px 6px 20px}
.tabbar span{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted)}
.tabbar span::before{content:"";width:22px;height:4px;border-radius:2px;background:var(--line)}
.tabbar span.on{color:var(--accent-ink);font-weight:600}
.tabbar span.on::before{background:var(--accent)}
.scroll{display:flex;gap:6px;overflow:hidden;white-space:nowrap}
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
(function(){
var NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
var TOP=[24,19,15,10,5,0],LOW=[0,5,10,15,19,24],SN=['e','B','G','D','A','E'],NF=24;
var md=function(a,b){return ((a%b)+b)%b;};
var nm=function(p){return NAMES[(p+4)%12];};
var LET=['C','D','E','F','G','A','B'],LPC=[0,2,4,5,7,9,11];
function spell(R,s,d){var li=(R.l+d)%7,tp=(R.pc+s)%12,df=md(tp-LPC[li],12);if(df>6)df-=12;var a=df===0?'':df===1?'♯':df===-1?'♭':df===2?'♯♯':df===-2?'♭♭':'';return LET[li]+a;}
var RE={n:'E',l:2,pc:4,r:0};

function seg(items,on){return '<span class="seg">'+items.map(function(t,i){return '<span'+(i===on?' class="on"':'')+'>'+t+'</span>';}).join('')+'</span>';}
function chip(t,on){return '<span class="chip'+(on?' on':'')+'">'+t+'</span>';}
function sel(t){return '<span class="sel">'+t+'</span>';}
function btn(t,c){return '<span class="btn'+(c?' '+c:'')+'">'+t+'</span>';}
function inp(t){return '<span class="inp">'+t+'</span>';}
function sw(on){return '<span class="sw'+(on?' on':'')+'"></span>';}
function slider(w,p){return '<span class="slider" style="width:'+w+'px"><b><i style="width:'+p+'%"></i></b><u style="left:'+p+'%"></u></span>';}
function legend(a){return '<div class="legend">'+a.map(function(x){return '<span><i style="background:'+x[0]+(x[2]?';border:3px solid '+x[2]:'')+'"></i>'+x[1]+'</span>';}).join('')+'</div>';}
function row(h,st){return '<div class="row"'+(st?' style="'+st+'"':'')+'>'+h+'</div>';}
function card(h,st){return '<div class="card"'+(st?' style="'+st+'"':'')+'>'+h+'</div>';}
function mut(t){return '<span class="mut">'+t+'</span>';}

function board(o){
var nv=o.nv||24,BX=76,BS=34,BY=44,BF=902/nv,h='',i,f,w;
var by=function(k){return BY+k*BS;},bw=function(k){return BX+k*BF;},bx=function(k){return k===0?BX-30:BX+(k-0.5)*BF;};
var top=by(0)-22,bot=by(5)+22,fm='fill:var(--muted)';
h+='<rect x="'+BX+'" y="'+top+'" width="'+(nv*BF)+'" height="'+(bot-top)+'" fill="#3A2419"/>';
for(w=1;w<=nv;w++)h+='<line x1="'+bw(w)+'" y1="'+top+'" x2="'+bw(w)+'" y2="'+bot+'" stroke="#C3C8CA" stroke-width="1.4"/>';
h+='<rect x="'+(BX-5)+'" y="'+top+'" width="6" height="'+(bot-top)+'" fill="#EFE9D6"/>';
for(i=0;i<6;i++){
h+='<line x1="'+(BX-5)+'" y1="'+by(i)+'" x2="'+bw(nv)+'" y2="'+by(i)+'" stroke="#D2D6D8" stroke-width="'+(0.9+i*0.45)+'"/>';
h+='<text x="16" y="'+by(i)+'" text-anchor="middle" dominant-baseline="central" style="'+fm+';font-size:13px">'+SN[i]+'</text>';
}
(o.bands||[]).forEach(function(bd){
var x1=bd.lo===0?BX-44:bw(bd.lo-1)+2,x2=bw(Math.min(bd.hi,nv))-2;
h+='<rect x="'+x1+'" y="'+(top+3)+'" width="'+(x2-x1)+'" height="'+(bot-top-6)+'" rx="10" fill="#5CC4B3" fill-opacity="0.2" stroke="#5CC4B3" stroke-width="2"/>';
});
var INL=[3,5,7,9,12,15,17,19,21,24];
for(f=1;f<=nv;f++){
var ink=INL.indexOf(f)>=0;
if(ink){
if(f===12||f===24)h+='<circle cx="'+(bx(f)-7)+'" cy="'+(bot+9)+'" r="3.5" fill="#8A6C56"/><circle cx="'+(bx(f)+7)+'" cy="'+(bot+9)+'" r="3.5" fill="#8A6C56"/>';
else h+='<circle cx="'+bx(f)+'" cy="'+(bot+9)+'" r="3.5" fill="#8A6C56"/>';
}
h+='<text x="'+bx(f)+'" y="'+(bot+28)+'" text-anchor="middle" style="fill:'+(ink?'var(--ink)':'var(--muted)')+';font-size:12px;font-weight:'+(ink?600:400)+'">'+f+'</text>';
}
(o.mk||[]).forEach(function(m){
var r=m.r||15;
h+='<g opacity="'+(m.op||1)+'"><circle cx="'+bx(m.f)+'" cy="'+by(m.s)+'" r="'+r+'" fill="'+m.fill+'" stroke="'+(m.st||'none')+'" stroke-width="'+(m.sw||1)+'"/>';
if(m.l)h+='<text x="'+bx(m.f)+'" y="'+by(m.s)+'" text-anchor="middle" dominant-baseline="central" fill="'+(m.tc||'#22170F')+'" font-size="13" font-weight="600">'+m.l+'</text>';
h+='</g>';
});
var y0=bot+46,rows=o.rows||[];
rows.forEach(function(r,k){
var y=y0+k*24;
r.items.forEach(function(it){
var x1=it.lo===0?BX-46:bw(it.lo-1)+3,x2=bw(Math.min(it.hi,nv))-3;
var fill=r.color?r.color:'var(--bar-'+(k%2?'b':'a')+')',tc=r.color?'#22170F':'var(--bar-'+(k%2?'bt':'at')+')';
h+='<rect x="'+x1+'" y="'+y+'" width="'+(x2-x1)+'" height="20" rx="5" style="fill:'+fill+(it.sel?';stroke:var(--ink);stroke-width:2':'')+'"/>';
h+='<text x="'+((x1+x2)/2)+'" y="'+(y+10)+'" text-anchor="middle" dominant-baseline="central" style="fill:'+tc+';font-size:12px;font-weight:600">'+((x2-x1<84&&it.short)?it.short:it.label)+'</text>';
});
});
var H=rows.length?(y0+rows.length*24+8):(bot+38);
var vw=o.crop||1000;
return '<svg viewBox="0 0 '+vw+' '+H+'" '+(o.crop?'style="width:100%;height:auto;display:block"':'width="1000" height="'+H+'" style="display:block"')+' font-family="Onest,-apple-system,system-ui,sans-serif" role="img" aria-label="'+(o.aria||'Гриф')+'">'+h+'</svg>';
}
function marks(nv,test){var out=[];for(var i=0;i<6;i++)for(var f=0;f<=nv;f++){var m=test(TOP[i]+f,i,f);if(m){m.s=i;m.f=f;out.push(m);}}return out;}
var PEARL={fill:'#F1E9D3',st:'#8C7A5A'},ROOT={fill:'#E0452B',st:'#FFB4A6',tc:'#fff'},AMBER={fill:'#F3B94A',st:'#9A6A10'};
function nt(o,l){return {fill:o.fill,st:o.st,tc:o.tc,l:l};}
function simpleRows(a){return a.map(function(r,k){return {items:[{lo:r[0],hi:r[1],label:'Поз. '+(k+1),short:String(k+1)}]};});}

function posRows(ps,only){
var n=ps.length,k=n===5?2:3,rows=[],win=0;
var Pf=function(idx){return 12*Math.floor(idx/n)+ps[md(idx,n)];};
for(var d=0;d<n;d++){
var items=[],best=null;
for(var m=-2;m<=4;m++){
var j0=d+n*m,cnt=0,lo=99,hi=-1,ns=[];
for(var i=0;i<6;i++)for(var t=0;t<k;t++){var fr=Pf(j0+i*k+t)-LOW[i];if(fr>=0&&fr<=NF){cnt++;ns.push((5-i)+','+fr);if(fr<lo)lo=fr;if(fr>hi)hi=fr;}}
if(cnt>=4&&hi>lo){var it={lo:lo,hi:hi,pos:d+1,label:'Поз. '+(d+1),short:String(d+1),ns:ns};items.push(it);if(cnt===6*k&&!best)best=it;}
}
if(only){var pick=best||items[0];rows.push({items:pick?[pick]:[]});if(pick&&pick.hi>win)win=pick.hi;}else rows.push({items:items});
}
rows.sort(function(a,b){var x=a.items[0]?a.items[0].lo:99,y=b.items[0]?b.items[0].lo:99;return (x-y)||(a.items[0].pos-b.items[0].pos);});
return {rows:rows,win:win};
}
var SC={
minpent:{t:'Мінорна пентатоніка',semis:[0,3,5,7,10],lab:['R','♭3','4','5','♭7'],deg:[0,2,3,4,6],par:'min'},
majpent:{t:'Мажорна пентатоніка',semis:[0,2,4,7,9],lab:['R','2','3','5','6'],deg:[0,1,2,4,5],par:'maj'},
dor:{t:'Дорійський',semis:[0,2,3,5,7,9,10],lab:['R','2','♭3','4','5','6','♭7'],deg:[0,1,2,3,4,5,6],par:'min'},
aeo:{t:'Еолійський (натуральний мінор)',semis:[0,2,3,5,7,8,10],lab:['R','2','♭3','4','5','♭6','♭7'],deg:[0,1,2,3,4,5,6],par:'min'}
};
function scaleView(o){
var sc=SC[o.k],M={};
sc.semis.forEach(function(s,i){M[s]=i;});
var par=sc.par==='min'?[0,3,5,7,10]:[0,2,4,7,9];
var pr=posRows(sc.semis,!o.full),nv=o.full?NF:Math.max(12,pr.win);
var selSet=null,bands=[];
if(o.sel){selSet={};pr.rows.forEach(function(rw){rw.items.forEach(function(it){if(it.pos===o.sel){it.ns.forEach(function(x){selSet[x]=1;});it.sel=true;bands.push({lo:it.lo,hi:it.hi});}});});}
var mk=marks(nv,function(p,i,f){
var s=p%12,ix=M[s];if(ix===undefined)return null;
var root=s===0,extra=par.indexOf(s)<0&&!root,inSel=selSet&&selSet[i+','+f];
var b=root?ROOT:(extra?AMBER:PEARL);
return {fill:b.fill,st:inSel?'#5CC4B3':b.st,sw:inSel?3:1,op:(selSet&&!inSel)?0.22:1,tc:b.tc,l:o.names===false?sc.lab[ix]:spell(RE,s,sc.deg[ix])};
});
var svg=board({nv:nv,mk:mk,rows:pr.rows,bands:bands,aria:'Гриф: '+sc.t});
var names=sc.semis.map(function(s,i){return spell(RE,s,sc.deg[i]);}).join(' ');
var info='E: '+sc.t+'. Ноти: '+names+'. Формула: '+sc.lab.join(' ')+'. '+(o.full?'Весь гриф, 24 лади.':'Лади 0–'+nv+': кожна позиція видна повністю.')+(o.sel?' Виділено позицію '+o.sel+'.':' Натисніть на смугу під грифом, щоб виділити позицію.');
return {svg:svg,info:info,extra:sc.par&&!sc.pent?true:false};
}

function Q(id){return QUAL.filter(function(q){return q[0]===id;})[0];}
var ROLE=function(d){return d===0?['#E0452B','#fff']:(d===4?['#5CC4B3','#22170F']:(d>=5?['#B69CF2','#22170F']:['#F3B94A','#22170F']));};
function chordBoard(R,qid,names){
var q=Q(qid),r=md(R.pc-4,12),M={};
q[3].forEach(function(e){M[e[0]]=e;});
var mk=marks(24,function(p){var s=md(p-r,12),e=M[s];if(!e)return null;var c=ROLE(e[2]);return {fill:c[0],st:'rgba(0,0,0,.35)',tc:c[1],l:names===false?e[1]:spell(R,e[0],e[2])};});
return board({nv:24,mk:mk,aria:'Звуки акорда на всьому грифі'});
}
var INVC=['#5CC4B3','#F3B94A','#B69CF2'];
function triadBoard(qid,a){
var q=Q(qid)[3],sem=q.map(function(e){return e[0];}),r=0,mk=[];
[[0,1,2],[1,2,0],[2,0,1]].forEach(function(ord,inv){
for(var fl=0;fl<=NF;fl++){
var p0=LOW[a]+fl;if(md(p0-r,12)!==sem[ord[0]])continue;
var p1=p0+md(sem[ord[1]]-sem[ord[0]],12),p2=p1+md(sem[ord[2]]-sem[ord[1]],12);
var fr=[fl,p1-LOW[a+1],p2-LOW[a+2]];
if(fr[1]<0||fr[2]<0||fr[1]>NF||fr[2]>NF)continue;
if(Math.max.apply(null,fr)-Math.min.apply(null,fr)>5)continue;
for(var k=0;k<3;k++){var isR=ord[k]===0;mk.push({s:5-(a+k),f:fr[k],fill:INVC[inv],st:isR?'#E0452B':'rgba(0,0,0,.35)',sw:isR?3.5:1,l:spell(RE,sem[ord[k]],q[ord[k]][2])});}
}
});
return board({nv:24,mk:mk,aria:'Тризвуччя на трьох струнах з інверсіями'});
}
var CAGED=[{n:'C',pc:0,f:[-1,3,2,0,1,0],c:'#5CC4B3'},{n:'A',pc:9,f:[-1,0,2,2,2,0],c:'#F3B94A'},{n:'G',pc:7,f:[3,2,0,0,0,3],c:'#B69CF2'},{n:'E',pc:4,f:[0,2,2,1,0,0],c:'#7DA7F2'},{n:'D',pc:2,f:[-1,-1,0,2,3,2],c:'#F08DAE'}];
function cagedBoard(){
var mk=[],rows=[],R=RE;
CAGED.forEach(function(sh){
var o=md(R.pc-sh.pc,12),items=[],mx=Math.max.apply(null,sh.f);
[o,o+12].forEach(function(off){
if(mx+off>NF)return;
var lo=99,hi=-1;
sh.f.forEach(function(fr,li){
if(fr<0)return;
var fret=fr+off,p=LOW[li]+fret,t=md(p,12),isR=t===0;
if(fret<lo)lo=fret;if(fret>hi)hi=fret;
var tone=t===0?'E':(t===4?'G♯':'B');
mk.push({s:5-li,f:fret,fill:isR?'#E0452B':sh.c,st:'rgba(0,0,0,.35)',tc:isR?'#fff':'#22170F',l:tone});
});
items.push({lo:lo,hi:hi,label:sh.n+'-форма',short:sh.n});
});
rows.push({color:sh.c,items:items});
});
rows.sort(function(a,b){return a.items[0].lo-b.items[0].lo;});
return board({nv:24,mk:mk,rows:rows,aria:'Форми CAGED для E мажор'});
}
function diagram(fr){
var x0=22,dx=11.2,y0=30,dy=17,h='',i;
h+='<svg viewBox="0 0 100 124" aria-hidden="true">';
h+='<rect x="'+x0+'" y="'+(y0-2.5)+'" width="'+(dx*5)+'" height="3.5" style="fill:var(--ink)"/>';
for(i=1;i<=5;i++)h+='<line x1="'+x0+'" y1="'+(y0+i*dy)+'" x2="'+(x0+dx*5)+'" y2="'+(y0+i*dy)+'" style="stroke:var(--muted)" stroke-width="1"/>';
for(i=0;i<6;i++)h+='<line x1="'+(x0+i*dx)+'" y1="'+y0+'" x2="'+(x0+i*dx)+'" y2="'+(y0+5*dy)+'" style="stroke:var(--muted)" stroke-width="1"/>';
fr.forEach(function(f,li){
var x=x0+li*dx;
if(f<0)h+='<text x="'+x+'" y="'+(y0-10)+'" text-anchor="middle" style="fill:var(--muted);font-size:11px">×</text>';
else if(f===0)h+='<circle cx="'+x+'" cy="'+(y0-11)+'" r="3.2" fill="none" style="stroke:var(--muted)" stroke-width="1.2"/>';
else h+='<circle cx="'+x+'" cy="'+(y0+(f-0.5)*dy)+'" r="5" style="fill:var(--accent)"/>';
});
return h+'</svg>';
}
function strip(W,c){
var half=W/2,h='<div class="strip" style="width:'+W+'px"><div class="zone" style="left:'+(half-W*0.05)+'px;width:'+(W*0.1)+'px"></div>';
for(var k=-50;k<=50;k+=10){
var x=half+(k/50)*half,maj=k%50===0,l=Math.min(W-2,Math.max(0,x-1));
h+='<div class="tk" style="left:'+l+'px;top:'+(maj?14:22)+'px;height:'+(maj?34:18)+'px;opacity:'+(maj?1:0.7)+'"></div>';
if(maj)h+='<div class="tl" style="left:'+(x-24)+'px">'+(k===0?'0':(k<0?'−50':'+50'))+'</div>';
}
var cc=Math.max(-50,Math.min(50,c));
return h+'<div class="nd" style="left:'+(half+(cc/50)*half-2)+'px"></div></div>';
}
