name: guitar-hub

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  cargo_checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
